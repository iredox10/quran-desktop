<!DOCTYPE html>
<!--
  RTL verse page for VerseWebView.
  Rendered fragment from TajweedHtmlRenderer.segmentsToHtml() is injected at
  {{VERSE_HTML}}. Load with a base URL pointing at this file's directory so
  the relative ../fonts/ URL below resolves to
  desktop/src/main/resources/fonts/kfgqpc_hafs.ttf; when loading via
  loadHtmlString() without a base URL, rewrite the @font-face src to a
  file:// URL or a base64 data: URI instead.
-->
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face {
  font-family: 'KFGQPC';
  src: url('../fonts/kfgqpc_hafs.ttf') format('truetype');
  font-display: swap;
}
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
}
body {
  font-family: 'KFGQPC', serif;
  line-height: 2.0;
  text-align: right;
  direction: rtl;
  padding: 8px 12px;
  word-wrap: break-word;
}
.verse {
  font-size: 22px;
}
</style>
</head>
<body>
<div class="verse" id="verse">{{VERSE_HTML}}</div>
</body>
</html>
